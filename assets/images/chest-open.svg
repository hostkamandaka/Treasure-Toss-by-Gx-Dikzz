  <path d="M60 34 L64 44 L74 46 L64 49 L60 60 L56 49 L46 46 L56 44 Z" fill="#fff6cf"/>

  <rect x="12" y="56" width="96" height="7" fill="#e8b84a"/>
  <rect x="12" y="76" width="96" height="7" fill="#e8b84a"/>
  <rect x="8" y="42" width="8" height="42" fill="#e8b84a"/>
  <rect x="104" y="42" width="8" height="42" fill="#e8b84a"/>
  <circle cx="60" cy="63" r="8" fill="#e8b84a"/>
  <circle cx="60" cy="63" r="3.4" fill="#5c3419"/>
</svg>
