<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100">
  <defs>
    <linearGradient id="gwood2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9713c"/><stop offset="1" stop-color="#7a4a26"/>
    </linearGradient>
    <linearGradient id="glid2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3cf6e"/><stop offset="1" stop-color="#d8a53d"/>
    </linearGradient>
    <radialGradient id="innerglow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#fff6cf"/>
      <stop offset="1" stop-color="#fff6cf" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="60" cy="94" rx="50" ry="6" fill="rgba(0,0,0,.28)"/>

  <!-- open lid tilted back behind the box -->
