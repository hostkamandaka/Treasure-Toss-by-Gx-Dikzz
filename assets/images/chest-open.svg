    <path d="M8 42 Q60 6 112 42 L112 50 Q60 20 8 50 Z" fill="url(#glid2)"/>
    <rect x="8" y="44" width="104" height="6" fill="#e8b84a" opacity=".8"/>
  </g>

  <!-- box body -->
  <rect x="12" y="42" width="96" height="42" rx="6" fill="url(#gwood2)"/>

  <!-- glow + sparkle inside -->
